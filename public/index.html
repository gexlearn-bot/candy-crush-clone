<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Reef Crush</title>
<meta name="description" content="Reef Crush is an ocean match-3 puzzle game with 20 levels. Swipe sea creatures into lines of three, make striped, bubble and rainbow pearl specials, and clear the reef.">
<meta name="theme-color" content="#ff4d6d">
<meta name="color-scheme" content="dark">
<!-- Installable app -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reef Crush">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32">
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="bg"><div class="sand"></div></div>

<div id="app">
  <!-- level map -->
  <section id="map" class="screen active">
    <header class="map-head">
      <div class="logo">Reef<span>Crush</span></div>
      <div class="head-right">
        <div class="toggles">
          <button class="icon-btn" id="mapSound" aria-label="Sound"></button>
          <button class="icon-btn" id="mapVib" aria-label="Vibration"></button>
          <button class="icon-btn" id="installBtn" aria-label="Install app" hidden></button>
        </div>
        <div class="star-total"><svg viewBox="0 0 24 24"><use href="#star"/></svg><span id="starTotal">0</span></div>
      </div>
    </header>
    <div id="mapScroll"><div id="mapPath"></div><div class="map-foot"><button class="switch" id="unlockAll" role="switch" aria-checked="false"><span class="knob"></span>Play any level</button><br><button class="link-btn" id="resetBtn">Reset progress</button></div></div>
  </section>

  <!-- game -->
  <section id="game" class="screen">
    <div class="hud">
      <div class="hud-top">
        <button class="icon-btn" id="backBtn" aria-label="Back to map"></button>
        <div class="lvl-label" id="lvlLabel">Level 1</div>
        <button class="icon-btn" id="gameSound" aria-label="Sound"></button>
      </div>
      <div class="hud-main">
        <div class="moves" id="movesBox"><div class="moves-n" id="movesN">0</div><div class="moves-l">moves</div></div>
        <div class="goals" id="goals"></div>
      </div>
      <div class="scorebar">
        <div class="score-n" id="scoreN">0</div>
        <div class="bar" id="bar"><div class="fill" id="barFill"></div></div>
      </div>
    </div>
    <div id="boardWrap">
      <div id="board"><div id="tiles"></div><div id="pieces"></div><div id="fx"></div></div>
    </div>
  </section>
</div>

<div id="modal" class="modal hidden"><div class="card" id="card"></div></div>

<!-- ============ artwork ============ -->
