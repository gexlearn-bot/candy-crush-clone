<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs><clipPath id="icon-tile"><rect width="1024" height="1024" rx="228"/></clipPath></defs>
  <g id="icon-tile-content" clip-path="url(#icon-tile)">
  <title>Reef Crush app icon (master artwork)</title>
  <!--
    Master artwork for the Reef Crush app icon. Full-bleed 1024 x 1024.
    Two top-level groups:
      #background  rainbow sea, light rays, glow, sand and seaweed (fills the whole square)
      #artwork     the hero clownfish, starfish and bubbles (kept inside the maskable safe zone)
    Each placed element uses a single transform attribute.
    scripts/build-icons.mjs derives every shipped icon from this file.
  -->
  <defs>
    <linearGradient id="sea-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset=".16" stop-color="#ff8c3a"/>
      <stop offset=".32" stop-color="#ffcc33"/>
      <stop offset=".5" stop-color="#3dd68c"/>
      <stop offset=".66" stop-color="#26b4f2"/>
      <stop offset=".83" stop-color="#5b6cff"/>
      <stop offset="1" stop-color="#9b4dff"/>
    </linearGradient>
    <linearGradient id="ray-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset=".75" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow-gradient" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sand-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3a3"/>
      <stop offset="1" stop-color="#e2b462"/>
    </linearGradient>
    <radialGradient id="bubble-gradient" cx=".34" cy=".3" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".18" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#bff1ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#bff1ff" stop-opacity=".35"/>
    </radialGradient>
    <clipPath id="clownfish-body-clip"><ellipse cx="54" cy="52" rx="35" ry="25"/></clipPath>
  </defs>

  <g id="background">
    <rect id="sea" width="1024" height="1024" fill="url(#sea-gradient)"/>
    <g id="light-rays" fill="url(#ray-gradient)">
      <path id="ray-1" d="M250 0 H390 L250 1024 H40 Z"/>
      <path id="ray-2" d="M520 0 H600 L640 1024 H470 Z"/>
      <path id="ray-3" d="M760 0 H880 L1024 860 V1024 H900 Z"/>
    </g>
    <ellipse id="center-glow" cx="512" cy="470" rx="420" ry="360" fill="url(#glow-gradient)"/>
    <g id="seaweed" fill="none" stroke-linecap="round">
      <path id="seaweed-left" d="M96 1024 C60 940 140 890 104 810 C72 740 130 690 112 620" stroke="#22c47f" stroke-width="30"/>
      <path id="seaweed-left-leaf" d="M106 760 C70 740 56 706 60 676" stroke="#22c47f" stroke-width="20"/>
      <path id="seaweed-right" d="M930 1024 C962 950 892 900 926 830 C952 774 906 736 920 690" stroke="#1fae73" stroke-width="28"/>
    </g>
    <g id="sand">
      <path id="sand-dune" d="M0 860 C240 790 780 800 1024 870 V1024 H0 Z" fill="url(#sand-gradient)"/>
      <path id="sand-shadow" d="M0 925 C300 880 720 885 1024 930 V1024 H0 Z" fill="#d6a352" opacity=".45"/>
    </g>
  </g>

  <g id="artwork">
    <g id="starfish" transform="translate(222 830) rotate(-16) scale(2.7) translate(-50 -50)">
      <path id="starfish-body" d="M50 9 L61.8 36.6 L91 39.4 L69 58.8 L75.6 87.6 L50 72.4 L24.4 87.6 L31 58.8 L9 39.4 L38.2 36.6 Z" fill="#ffc531" stroke="#7a4a00" stroke-width="5" stroke-linejoin="round"/>
      <circle id="starfish-cheek-left" cx="38" cy="55" r="3.4" fill="#ff9a6a"/>
      <circle id="starfish-cheek-right" cx="62" cy="55" r="3.4" fill="#ff9a6a"/>
      <circle id="starfish-eye-left" cx="43.5" cy="48" r="4" fill="#3a2000"/>
      <circle id="starfish-eye-right" cx="56.5" cy="48" r="4" fill="#3a2000"/>
      <path id="starfish-smile" d="M44.5 56 Q50 61 55.5 56" fill="none" stroke="#7a4a00" stroke-width="3" stroke-linecap="round"/>
    </g>

    <g id="clownfish" transform="translate(500 470) rotate(-10) scale(7.2) translate(-47 -50)">
      <g id="clownfish-fins" fill="#ff7a1a" stroke="#4a1d05" stroke-width="3.2" stroke-linejoin="round">
        <path id="fin-tail" d="M24 52 C14 42 8 36 5 32 C9 45 9 59 5 72 C8 68 14 62 24 52Z"/>
        <path id="fin-dorsal" d="M38 31 C44 15 62 13 70 29Z"/>
        <path id="fin-pelvic" d="M48 74 C52 85 63 87 67 76Z"/>
      </g>
      <ellipse id="clownfish-body" cx="54" cy="52" rx="35" ry="25" fill="#ff922e"/>
      <g id="clownfish-bands" clip-path="url(#clownfish-body-clip)">
        <path id="band-rear" d="M32 20 C26 40 26 64 32 84 L42 84 C36 64 36 40 42 20Z" fill="#fff" stroke="#4a1d05" stroke-width="2.8"/>
        <path id="band-front" d="M58 20 C53 40 53 64 58 84 L67 84 C62 64 62 40 67 20Z" fill="#fff" stroke="#4a1d05" stroke-width="2.8"/>
        <ellipse id="body-shine" cx="50" cy="35" rx="28" ry="7" fill="#fff" opacity=".4"/>
      </g>
      <ellipse id="clownfish-outline" cx="54" cy="52" rx="35" ry="25" fill="none" stroke="#4a1d05" stroke-width="3.2"/>
      <g id="clownfish-face">
        <circle id="eye-white" cx="77" cy="47" r="7.5" fill="#fff" stroke="#4a1d05" stroke-width="2.3"/>
        <circle id="eye-pupil" cx="78.5" cy="47" r="4.2" fill="#1a0a02"/>
        <circle id="eye-glint" cx="80" cy="45.3" r="1.5" fill="#fff"/>
        <circle id="cheek" cx="71" cy="58" r="3" fill="#ffb27a"/>
        <path id="smile" d="M79 60 Q83 63.5 87 59.5" fill="none" stroke="#4a1d05" stroke-width="2.4" stroke-linecap="round"/>
      </g>
    </g>

    <g id="bubbles" stroke="#fff" stroke-opacity=".85" stroke-width="7" fill="url(#bubble-gradient)">
      <circle id="bubble-large" cx="842" cy="300" r="46"/>
      <circle id="bubble-medium" cx="900" cy="186" r="30"/>
      <circle id="bubble-small" cx="852" cy="104" r="19"/>
      <circle id="bubble-left" cx="176" cy="252" r="24"/>
      <circle id="bubble-left-small" cx="232" cy="178" r="14"/>
    </g>
  </g>
</g>
</svg>
